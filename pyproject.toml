[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomies"
version = "0.1.0"
description = "A quadruped that learns to walk and take a kick: PPO from scratch, 1024 MuJoCo envs in parallel"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nonberw" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mujoco>=3.2", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/nonberw/zoomies"

[tool.setuptools]
packages = ["zoomies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
